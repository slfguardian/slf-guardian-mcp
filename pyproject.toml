[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slf-guardian-mcp"
version = "1.2.2"
description = "MCP security checks for AI agents before they deliver code, install dependencies, run commands, read untrusted content, or open links"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SLF Guardian", email = "team@slfguardian.com" }]
keywords = ["mcp", "mcp-security", "security", "ai-agent", "agent-security",
            "ai-security", "prompt-injection", "slopsquatting", "supply-chain",
            "supply-chain-security", "coding-agent", "code-audit", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://slfguardian.com"
Documentation = "https://slfguardian.com/api"
API = "https://slfguardian.com/openapi.json"
Repository = "https://github.com/slfguardian/slf-guardian-mcp"
Issues = "https://github.com/slfguardian/slf-guardian-mcp/issues"

[project.scripts]
slf-guardian-mcp = "slf_guardian_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
