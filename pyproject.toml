[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slf-guardian-mcp"
version = "1.2.3"
description = "Local stdio MCP client for hosted pre-action checks on packages, commands, code and untrusted content"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SLF Guardian", email = "team@slfguardian.com" }]
keywords = ["mcp", "mcp-server", "mcp-registry", "mcp-tools", "mcp-security",
            "security", "ai-agent", "agent-security", "ai-security", "coding-agent",
            "claude-code", "cursor", "codex", "github-copilot", "prompt-injection",
            "slopsquatting", "supply-chain-security", "static-analysis", "code-audit",
            "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
x402 = [
  "x402[evm,requests]==2.28.0",
  "cdp-sdk==1.53.0",
]

[project.urls]
Homepage = "https://slfguardian.com"
Documentation = "https://github.com/slfguardian/slf-guardian-mcp#install-in-about-two-minutes"
API = "https://slfguardian.com/openapi.json"
Repository = "https://github.com/slfguardian/slf-guardian-mcp"
Issues = "https://github.com/slfguardian/slf-guardian-mcp/issues"
MCPRegistry = "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.slfguardian%2Fslf-guardian-mcp&limit=10"

[project.scripts]
slf-guardian-mcp = "slf_guardian_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
